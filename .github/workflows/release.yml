name: 发布 Release

# 手动触发：仓库 Actions 页面 → 「发布 Release」 → Run workflow
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '本次发布说明（用于 GitHub Release 描述，可留空）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 修复 gradlew 执行权限
        run: chmod +x gradlew

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 还原签名 keystore（来自 Secrets）
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "::error::未配置 Secret RELEASE_KEYSTORE，请先将 runbeat-release.jks 转 base64 后添加（见 docs/CI_RELEASE.md）"
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > runbeat-release.jks
          chmod 600 runbeat-release.jks

      - name: CI 使用官方 Gradle 发行版（本地为阿里云镜像，CI 环境下载会卡死）
        run: |
          sed -i 's|distributionUrl=.*gradle-|distributionUrl=https://services.gradle.org/distributions/gradle-|' gradle/wrapper/gradle-wrapper.properties
          grep -o 'distributionUrl=.*' gradle/wrapper/gradle-wrapper.properties

      - name: 递增版本号 + 生成 deploy/manifest.json
        run: ./gradlew :app:bumpVersion --no-daemon

      - name: 解析新版本号
        run: |
          VERSION=$(grep '^VERSION_NAME' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "本次发布版本: v$VERSION"

      - name: 写入 release_notes 到 manifest（update_url 保持为自有 CDN）
        env:
          REL_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 - "$REL_NOTES" <<'EOF'
          import json, sys
          p = "deploy/manifest.json"
          d = json.load(open(p, encoding="utf-8"))
          if sys.argv[1]:
              d["release_notes"] = sys.argv[1].replace("\\n", "\n")
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("update_url ->", d["update_url"])
          print("release_notes ->", d["release_notes"])
          EOF

      - name: 构建已签名 Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "runbeat-${APP_VERSION}.apk"

      - name: 提交版本递增回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties deploy/manifest.json app/src/main/assets/update_mock.json
          git commit -m "chore: 版本递增至 v${APP_VERSION}" || echo "无可提交变更"
          git push origin HEAD:"${GITHUB_REF_NAME}" || echo "::warning::推送失败（不影响本次发布，下次发版前请手动同步仓库）"

      - name: 创建 GitHub Release 并上传 APK 与 manifest（备份）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: RunBeat v${{ env.APP_VERSION }}
          body: ${{ inputs.release_notes || '自动发布' }}
          files: |
            runbeat-${{ env.APP_VERSION }}.apk
            deploy/manifest.json
          fail_on_unmatched_files: true

      - name: 上传到七牛云 CDN（配置了 Secrets 才执行）
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          if [ -z "$QINIU_AK" ] || [ -z "$QINIU_SK" ] || [ -z "$QINIU_BUCKET" ]; then
            echo "::warning::未配置七牛云 Secrets（QINIU_AK / QINIU_SK / QINIU_BUCKET），跳过 CDN 上传，请手动上传 APK 与 manifest.json"
            exit 0
          fi
          curl -sL -o qshell.tar.gz "https://github.com/qiniu/qshell/releases/download/v2.19.11/qshell-v2.19.11-linux-amd64.tar.gz"
          tar -xzf qshell.tar.gz
          ./qshell account "$QINIU_AK" "$QINIU_SK" "runbeat"
          ./qshell fput "$QINIU_BUCKET" "runbeat/runbeat-${APP_VERSION}.apk" "runbeat-${APP_VERSION}.apk" --overwrite
          ./qshell fput "$QINIU_BUCKET" "runbeat/manifest.json" "deploy/manifest.json" --overwrite
          echo "已上传七牛云："
          echo "  https://cdn.sunrise1024.top/runbeat/manifest.json"
          echo "  https://cdn.sunrise1024.top/runbeat/runbeat-${APP_VERSION}.apk"
